<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Light activating a photoswitch on a retinal neuron">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#1a3a6e"/>
    </linearGradient>
    <radialGradient id="lightGlow" cx="0.2" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#ffd166" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg1)"/>
  <rect width="1200" height="800" fill="url(#lightGlow)"/>

  <!-- Light wavefronts -->
  <g stroke="#ffd166" stroke-width="3" fill="none" opacity="0.55">
    <path d="M 80 220 Q 220 180 360 220"/>
    <path d="M 80 280 Q 220 240 360 280"/>
    <path d="M 80 340 Q 220 300 360 340"/>
    <path d="M 80 400 Q 220 360 360 400"/>
  </g>
  <!-- Light arrow -->
  <g stroke="#ffd166" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <line x1="100" y1="500" x2="380" y2="320"/>
    <polyline points="350,290 380,320 350,355"/>
  </g>

  <!-- Photoswitch: cis -> trans isomerization stylized -->
  <g transform="translate(420, 340)" stroke="#e0e7ff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- cis (kinked) form -->
    <circle cx="-30" cy="-60" r="22" fill="#0b2545"/>
    <line x1="-30" y1="-38" x2="0" y2="-10"/>
    <line x1="0" y1="-10" x2="40" y2="-30"/>
    <circle cx="40" cy="-30" r="22" fill="#0b2545"/>
    <!-- arrow -->
    <line x1="80" y1="0" x2="160" y2="0" stroke="#9ec5fe" stroke-width="4"/>
    <polyline points="145,-12 160,0 145,12" stroke="#9ec5fe" stroke-width="4"/>
    <!-- trans (extended) form -->
    <circle cx="200" cy="0" r="22" fill="#0b2545"/>
    <line x1="222" y1="0" x2="278" y2="0"/>
    <circle cx="300" cy="0" r="22" fill="#0b2545"/>
  </g>

  <!-- Stylized retinal ganglion cell -->
  <g transform="translate(820, 460)" fill="none" stroke="#e0e7ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- soma -->
    <ellipse cx="0" cy="0" rx="60" ry="48" fill="#0b2545" stroke-width="5"/>
    <!-- nucleus -->
    <circle cx="-8" cy="-6" r="20" fill="#1a3a6e" stroke="#9ec5fe" stroke-width="2"/>
    <!-- dendrites top -->
    <path d="M -50 -40 Q -90 -90 -130 -100"/>
    <path d="M -130 -100 Q -160 -110 -180 -130"/>
    <path d="M -130 -100 Q -150 -80 -190 -85"/>
    <path d="M -20 -48 Q -30 -110 -50 -150"/>
    <path d="M -50 -150 Q -55 -170 -75 -190"/>
    <path d="M -50 -150 Q -30 -180 -10 -195"/>
    <path d="M 30 -42 Q 50 -100 70 -130"/>
    <path d="M 70 -130 Q 90 -160 120 -170"/>
    <path d="M 70 -130 Q 60 -160 30 -180"/>
    <!-- axon -->
    <path d="M 50 25 Q 100 80 180 110 T 320 150"/>
    <!-- spike marks along axon -->
    <line x1="120" y1="78" x2="125" y2="62" stroke="#ffd166" stroke-width="3"/>
    <line x1="180" y1="100" x2="185" y2="84" stroke="#ffd166" stroke-width="3"/>
    <line x1="240" y1="125" x2="245" y2="109" stroke="#ffd166" stroke-width="3"/>
  </g>

  <!-- Caption-like text removed; the SVG is purely decorative for the card -->
</svg>
